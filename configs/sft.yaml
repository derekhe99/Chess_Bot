# SFT (Step 5): the LLM player's settings, then how it's trained on Stockfish labels.

# The LLM player (Step 4, model/llm_policy.py -> PolicyConfig). Lives here because
# RL (Step 7) continues from the SFT adapters, so the LoRA shape is set once, at SFT.
# May move to its own file when the config design is aligned (plan Sec 5, item 2).
policy:
  model_id: Qwen/Qwen3-0.6B
  representation: structured     # structured | fen      (the board-representation toggle)
  masked: true                   # true = pick among legal moves only; false = free generation
  instruction: "You are playing chess. Reply with your move for the side to move, in UCI notation (for example e2e4, or e7e8q to promote)."
  enable_thinking: false         # Qwen3's hard switch; false = the non-reasoning baseline
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dtype: auto                    # bf16 on GPUs that have it (L4), fp16 otherwise (T4), fp32 on CPU
  score_batch_size: 32           # legal moves scored per forward pass (bounds GPU memory)
  prefix_cache: true             # run the prompt once and reuse it for every legal move
  max_new_tokens: 8              # unmasked: a UCI move is at most 5 characters
  retry_temperature: 1.0         # unmasked: sampling temperature after an illegal move (1st try is greedy)
  seed: 0

# Training (train/sft.py -> TrainConfig).
#
# Day-1 run (Sep 28, 2026): train_positions=5000, checkpoint_every=500. Logged in
# results/experiments.csv (utils/logging.py): real move-selection learning (val_top1
# 3% -> ~21%) but no checkpoint ever scored a point off Stockfish 1320 in the screen, so
# the reference set doesn't connect yet (Step 5 gate not met). val_move_loss also
# degraded after ~epoch 5 while val_top1 kept climbing -- overfitting on repeating the
# same 5,000 positions 10 times, not a top-1/ranking problem. Treated as Day-1 done;
# connecting the reference set is this next run's job, not a blocker to log the finding.
#
# Next run (Sep 28, 2026): train on the full labeled train split instead of a slice, to
# fix the overfitting directly with more unique data rather than fewer epochs on the same
# 5,000. checkpoint_every raised to keep the checkpoint count sane at 10x the steps (was
# 8 checkpoints at 3,130 steps; would be 63 at the old 500-step interval over ~28,120
# steps -- each one a full save + validation pass, and later a full screening pass).
train:
  dataset: sft_2013-06_d12_n50000   # folder under Drive data/processed/ (the Step 3 full build)
  train_positions: null          # null = the whole train split (44,982 positions; the other
                                  # 5,018 of the 50,000 are held out for validation and are
                                  # never trained on, Day-1 or otherwise)
  val_positions: 1000            # validation losses at each checkpoint (from the held-out games)
  val_top1_positions: 200        # ...and how often the masked pick equals Stockfish's move (slower: scores every legal move)
  epochs: 10                     # unchanged from Day-1; watch this run's own val_top1 / val_move_loss
                                  # curve for whether 10 is still right at 10x the unique data
  batch_size: 16                 # unchanged; Day-1 used 16.5 of 24 GB on the L4, comfortable headroom
  optimizer: adamw
  learning_rate: 1.0e-4          # constant (no warmup, no decay)
  weight_decay: 0.0
  grad_clip: 1.0                 # max gradient norm; guards against a single bad batch blowing up the adapters
  value_loss: bce                # bce | mse -- on the value head's win probability vs Stockfish's
  value_loss_weight: 1.0         # lambda: total loss = move loss + lambda * value loss
  checkpoint_every: 5000         # optimizer steps between saved checkpoints (step 0 = untrained is saved too)
                                  # -- was 500 for the 5k-position Day-1 run; raised 10x along with the data
  log_every: 25                  # optimizer steps between train-loss log lines
  seed: 0
