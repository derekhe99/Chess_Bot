# Step 3 -- SFT data pipeline (plan v3, Sec 3.2 and Step 3); `scaled` below is Step 13 (plan v5).
# First values; the Step 3 timing run (~5k positions) tunes them. The wider config
# design (merging, overrides) is still an open alignment point (plan Sec 5).

source_month: "2013-06"      # Lichess monthly dump, pinned by name (~225k rated games)

num_positions: 50000         # full dataset; the notebook's timing run uses a smaller number
phase_mix:                   # fraction of positions per phase; must sum to 1
  opening: 0.3333
  middlegame: 0.3334
  endgame: 0.3333
phase_rule:
  opening_max_ply: 20        # opening = before ply 20 (first 10 moves each)...
  endgame_max_material: 13   # ...unless non-pawn material left (both sides; N/B 3, R 5, Q 9) <= 13 -> endgame

stockfish_label_depth: 12    # fixed search depth per label; one thread, hash cleared per position
label_chunk_size: 250        # positions per saved chunk (the resume unit)
val_fraction: 0.1            # share of GAMES held out for validation
seed: 0

# Step 13 (plan v5): the scaled dataset, sampled fresh with the same rules as above (phase
# mix, phase rule, label depth, chunk size, seed). Notebook 01 with BUILD = "scaled".
scaled:
  num_positions: 500000
  # Read in this order until every phase quota is full; a month is downloaded only when
  # reached. ~225k-580k games each; the endgame quota (~167k) is what needs several.
  source_months: ["2013-06", "2013-07", "2013-08", "2013-09", "2013-10", "2013-11", "2013-12"]
  # The one validation set every size shares: this dataset's by-game validation split
  # (val_fraction, seed above). Its games and positions are never sampled into the 500k.
  val_from: sft_2013-06_d12_n50000
